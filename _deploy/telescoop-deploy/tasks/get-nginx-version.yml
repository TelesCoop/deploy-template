# Read the installed nginx version into `nginx_version`, used by nginx.conf.j2 to
# pick the http2 syntax (`http2 on;` only exists since nginx 1.25.1).
# Falls back to "0" (legacy syntax, understood by every version) if nginx is missing.
---
- name: Read nginx version
  ansible.builtin.command: nginx -v
  register: nginx_version_output
  changed_when: false
  failed_when: false
  check_mode: false

- name: Store nginx version
  ansible.builtin.set_fact:
    nginx_version: "{{ (nginx_version_output.stderr | default('') | regex_search('nginx/([0-9.]+)', '\\1') or ['0']) | first }}"
