organization_slug: telescoop
base_project_slug: my-project
main_user: my-project
main_user_uid: 10042 # TODO must be unique for each project on the server
django_project_name: "{{ base_project_slug.replace('-', '_') }}_back"
backend_repo: git@github.com:{{ organization_slug }}/{{ base_project_slug }}/backend.git
frontend_repo: git@github.com:{{ organization_slug }}/{{ base_project_slug }}/{{ base_project_slug }}_front.git
is_mono_repo: true
backend_identity_file_path: /home/{{ main_user }}/.ssh/id_ed25519_backend
frontend_identity_file_path: "{{ backend_identity_file_path if is_mono_repo else '/home/{{ main_user }}/.ssh/id_ed25519_frontend' }}"
var_log_path: /var/log/{{ organization_slug }}/{{ project_slug }}
project_base_dir: /{{ organization_slug }}/{{ base_project_slug }}
supervisor_conf: /etc/supervisor/conf.d

requests_timeout: 30

# Python comes from uv, not from the distribution. Projects with a uv.lock follow their
# .python-version; python_version ("X.Y") only applies to projects still on requirements.txt,
# and changing it rebuilds their venv on the next deploy.
python_version: "3.13"
uv_version: "0.13.7"
uv_platform: x86_64-unknown-linux-gnu
uv_environment:
  UV_PYTHON_INSTALL_DIR: /opt/uv/python
  UV_PYTHON_PREFERENCE: only-managed
  UV_LINK_MODE: copy
uv_cache_dir: /var/cache/uv/{{ main_user }}
# The app user cannot write to the shared Python install dir: Python is installed beforehand, as root.
uv_user_environment: "{{ uv_environment | combine({'UV_CACHE_DIR': uv_cache_dir, 'UV_PYTHON_DOWNLOADS': 'never'}) }}"
venv:
  path: /usr/local/{{ organization_slug }}/{{ project_slug }}/backend/venv

# OpenTelemetry instrumentation of the backend, exported to the Alloy agent of the server.
observability:
  enabled: false
  otlp_endpoint: http://localhost:4318
  traces_sampler: parentbased_traceidratio
  traces_sampler_arg: "1.0"
opentelemetry_packages:
  - opentelemetry-distro==0.66b2
  - opentelemetry-exporter-otlp-proto-http==1.45.2
  - opentelemetry-instrumentation-django==0.66b2
  - opentelemetry-instrumentation-logging==0.66b2
  - opentelemetry-instrumentation-psycopg==0.66b2
  - opentelemetry-instrumentation-psycopg2==0.66b2
  - opentelemetry-instrumentation-requests==0.66b2
# if using postgresql database, you will need to
# - define the var `database_password`
# - install an additional Ansible module `ansible-galaxy collection install community.postgresql`
database_provider: postgresql # sqlite or postgresql
backend_is_django: true

# can be SSR or static
frontend_mode: SSR
build_command: build # usually `build-only` for a static vue project

has_backend: true

maintenance_page: "maintenance.html"
# maintenance_logo_source: "/chemin/local/vers/logo.png" # Chemin du logo sur le frontend_static (Optionnel)
