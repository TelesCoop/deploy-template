version: 2
updates:
  - package-ecosystem: pip
    directory: /_python
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directories:
      - /
      - /_python
    schedule:
      interval: monthly
    groups:
      pre-commit-hooks:
        patterns: ["*"]
