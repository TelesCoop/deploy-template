# Add `target-branch: dev` to every entry when preprod is deployed from an active dev branch.
version: 2
updates:
  - package-ecosystem: uv
    directory: /back
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
    groups:
      js-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit-hooks:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
